name: Android CI

on:
  push:
    branches: [ master, sms ]
  pull_request:
    branches: [ master, sms ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle

    - name: Build with Gradle
      run: ./gradlew assembleDebug -x test -x lint

    # Debugging step to list the contents of the build folder
    - name: Find APK files
      run: |
        echo "Looking for APK files..."
        find . -name "*.apk" -type f
        echo "Build outputs structure:"
        ls -la myExpenses/build/outputs/ || echo "outputs folder not found"
        ls -la myExpenses/build/outputs/apk/ || echo "apk folder not found"


    - name: Upload APK (External)
      uses: actions/upload-artifact@v4
      with:
        name: myExpenses-extern-debug
        path: myExpenses/build/outputs/apk/extern/debug/myExpenses-extern-debug.apk

    - name: Upload APK (Internal)
      uses: actions/upload-artifact@v4
      with:
        name: myExpenses-intern-debug
        path: myExpenses/build/outputs/apk/intern/debug/myExpenses-intern-debug.apk